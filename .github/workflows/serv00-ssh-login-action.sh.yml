name: serv00-ssh-login-action.sh

on:
  # schedule:
    # - cron: '0 18 * * *' # 每天一次
    # - cron: '0 18 * * 0' #每周日一次
  workflow_dispatch: # 支持手动执行

jobs:
  run_sh:
    runs-on: ubuntu-latest

    steps:
      - name: 迁出代码
        uses: actions/checkout@v4

      - name: 安装软件
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sshpass sendemail libnet-ssleay-perl libio-socket-ssl-perl

      - name: 设置时区
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: 运行脚本
        run: |
          chmod 600 *.pem
          sh run.sh
